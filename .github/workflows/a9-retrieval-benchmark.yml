name: A9 Retrieval Benchmark

on:
  pull_request:
    paths:
      - "benchmarks/retrieval/**"
      - "tests/benchmarks/**"
      - ".github/workflows/a9-retrieval-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mizan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mizan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark dependency
        run: python -m pip install -r benchmarks/retrieval/requirements.txt pytest
      - name: Static metric tests
        run: python -m pytest tests/benchmarks/test_retrieval_metrics.py -q
      - name: Confirm engine versions
        env:
          PGPASSWORD: postgres
        run: |
          echo "Postgres:"
          psql -h 127.0.0.1 -U postgres -d mizan -Atc "SHOW server_version"
          psql -h 127.0.0.1 -U postgres -d mizan -Atc "CREATE EXTENSION IF NOT EXISTS vector; SELECT extversion FROM pg_extension WHERE extname='vector';"
          echo "Qdrant:"
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:6333/", timeout=10) as r:
              print(r.read().decode())
          PY
      - name: Run A9 benchmark
        env:
          QDRANT_URL: http://127.0.0.1:6333
          PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/mizan
          MIZAN_BENCH_DOCS: "5000"
          MIZAN_BENCH_QUERIES: "1000"
          MIZAN_BENCH_OUT: benchmarks/retrieval/results/benchmark-results.json
        run: python benchmarks/retrieval/run_benchmark.py
      - name: Capture container resource snapshot
        if: always()
        run: |
          mkdir -p benchmarks/retrieval/results
          docker stats --no-stream --format '{{.Name}}	{{.CPUPerc}}	{{.MemUsage}}' > benchmarks/retrieval/results/container-stats.txt || true
          docker ps --format '{{.Image}}	{{.Names}}	{{.Status}}' > benchmarks/retrieval/results/container-status.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a9-retrieval-benchmark-results
          path: benchmarks/retrieval/results/
          if-no-files-found: error
