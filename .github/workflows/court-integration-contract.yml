name: MIZAN Court Integration Contract
on:
  pull_request:
    paths:
      - 'contracts/court-session-artifact-v1/**'
      - 'docs/architecture/MIZAN_COURT_INTEGRATION_CONTRACT_V1.md'
      - 'tests/architecture/test_mizan_court_integration.py'
      - '.github/workflows/court-integration-contract.yml'
  workflow_dispatch:
concurrency:
  group: court-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Verify MIZAN Court invariants
        run: python -m pytest tests/architecture/test_mizan_court_integration.py -q
