name: A12-A13 Knowledge Reasoning Stack
on:
  pull_request:
    paths:
      - "agents/mizan_agents/knowledge_layer.py"
      - "agents/mizan_agents/verification_gate.py"
      - "agents/mizan_agents/legal_reasoning.py"
      - "agents/mizan_agents/epistemic.py"
      - "tests/knowledge/**"
      - ".github/workflows/a12-a13-knowledge-reasoning.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pytest
      - name: Knowledge reasoning adversarial tests
        env: {PYTHONPATH: "agents:contracts"}
        run: python -m pytest tests/knowledge -q
      - name: Evidence regression
        env: {PYTHONPATH: "agents:contracts"}
        run: python -m pytest tests/agents/test_evidence_resolution.py tests/agents/test_evidence_provenance_agent.py -q
      - name: Architecture regression
        env: {PYTHONPATH: "agents:contracts"}
        run: python -m pytest tests/architecture -q
