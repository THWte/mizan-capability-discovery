name: A11 Retrieval Fabric

on:
  pull_request:
    paths:
      - "agents/mizan_agents/retrieval_*.py"
      - "agents/mizan_agents/citation_engine.py"
      - "tests/retrieval/**"
      - "tests/citation/**"
      - "docs/retrieval/**"
      - "docs/architecture/adr/ADR-0010*"
      - ".github/workflows/a11-retrieval-fabric.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: A11 targeted tests
        env:
          PYTHONPATH: agents:contracts
        run: python -m pytest tests/retrieval tests/agents/test_citation_engine.py -q
      - name: Architecture regression
        env:
          PYTHONPATH: agents:contracts
        run: python -m pytest tests/architecture -q
